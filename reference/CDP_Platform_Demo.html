,g3:["Monthly coaching conversations"],g5:["Regulatory compliance controls"]}},{section:"H",perspective:"AGREED",status:"AGREED",workshop_date:"2026-09-21",participants:["David Otieno (CEO)","Lucy Mutua (CHRO)","Joseph Mwangi (CFO)","Ruth Achieng (COO)"],payload:{h1:"Annual review against sales targets only",h5:"Multi-layer sign-offs on small spend"}},{section:"I",perspective:"AGREED",status:"AGREED",workshop_date:"2026-09-21",participants:["David Otieno (CEO)","Lucy Mutua (CHRO)","Joseph Mwangi (CFO)","Ruth Achieng (COO)"],payload:{cohorts:["Executive","Department","Grade","Tenure"],anonymity:"FULL",languages:["en-GB"],window:["2026-10-05","2026-10-19"]}}],dX={c1_requirements:[{goal_type:"INNOVATION_NEW_MODELS",orientations:["INNOVATE"],requirement_id:"req_01",source_refs:["B3.1","B3.2"],thresholds:{INNOVATE:"28"},type:"SINGLE"}],c4_requirement:{model:"SERVICE_B2C",model_transition:!1,orientations:["ENGAGE","PERFORM"],thresholds:{ENGAGE:"30",PERFORM:"30"},type:"PAIRED"},kpi_for:{ENGAGE:{baseline:19,name:"Voluntary attrition (%)",target:13},GOVERN:{baseline:21,name:"Approval cycle time (days)",target:7},INNOVATE:{baseline:28,name:"Digital channel adoption (%)",target:45}},leadership_target_orientation:"ENGAGE"},pX={pass:!0,checks:[{id:"L2",check:"Sections B–I agreed with workshop records",pass:!0,blocking:!0},{id:"L3",check:"Priorities tagged, business model set, leadership target resolved",pass:!0,blocking:!0},{id:"L4",check:"Scorecard has a KPI with baseline and 12-month target",pass:!0,blocking:!0},{id:"L5",check:"Window ≥ 10 working days (11)",pass:!0,blocking:!0},{id:"L6",check:"Privacy regime, residency and consent text set",pass:!0,blocking:!0}]},hX={invited:480,submitted:475,response_rate:.99},vX={organisation:"Mwangaza Bank (demo)",assessment_id:"asm_demo",window_close:"2026-10-19",completion_estimate:"35–45 minutes",consent_text_version:"cst_KE_v4",instrument:{scenarios:[{scenario_id:"D1-S1",dimension:"D1",title:"Organisational Character",prompt_now:"How would you describe the fundamental character of this organisation today?",prompt_preferred:"What fundamental character must this organisation have five years from now?",statements:[{orientation:"ENGAGE",text:"This organisation is fundamentally a people-centred community. Deep relationships, mutual care, and shared purpose define daily experience. People invest in one another as whole human beings, not merely as role-holders or performance units."},{orientation:"INNOVATE",text:"This organisation is fundamentally an ideas engine. Bold experimentation, creative disruption, and the freedom to challenge convention define who we are. We move fast and prize originality over conformity at every level."},{orientation:"PERFORM",text:"This organisation is fundamentally a performance machine. Ambitious goals, relentless execution, and measurable outcomes define us. We compete hard, celebrate achievement loudly, and hold ourselves to exacting standards."},{orientation:"GOVERN",text:"This organisation is fundamentally a system of order. Clear structures, defined processes, and consistent standards define how we work. We value precision, reliability, and systematic discipline above improvisation."}]},{scenario_id:"D1-S2",dimension:"D1",title:"New Employee Experience",prompt_now:"What do new employees consistently notice and remark upon within their first few weeks?",prompt_preferred:"What should new employees notice and remark upon within their first few weeks in the future organisation?",statements:[{orientation:"ENGAGE",text:"New employees immediately notice the warmth and genuine inclusion. Colleagues go out of their way to welcome them, offer proactive support, and make them feel part of something that transcends any single role or task."},{orientation:"INNOVATE",text:"New employees immediately notice the energy and creative freedom. They are quickly encouraged to question existing approaches, propose ideas boldly, and take ownership of challenges without waiting for permission."},{orientation:"PERFORM",text:"New employees immediately notice the pace and the performance expectations. They quickly understand that results matter, targets are taken seriously, and strong delivery is expected and closely observed from the very first week."},{orientation:"GOVERN",text:"New employees immediately notice the structure and operational clarity. There are established ways of doing things, clear reporting lines, and thoroughly documented expectations for every level and function across the organisation."}]},{scenario_id:"D1-S3",dimension:"D1",title:"Response to Adversity",prompt_now:"How does this organisation characteristically respond when things go significantly wrong?",prompt_preferred:"How should this organisation respond when things go significantly wrong in the future?",statements:[{orientation:"ENGAGE",text:"When things go seriously wrong, we rally together as a community. People offer genuine support, share the burden collectively, and focus on protecting team morale while communicating openly and looking after each other through difficulty."},{orientation:"INNOVATE",text:"When things go seriously wrong, we treat it as essential learning. We diagnose rapidly, experiment with recovery approaches, and view failure as data that makes us smarter, not as a signal to blame, retreat, or become more risk-averse."},{orientation:"PERFORM",text:"When things go seriously wrong, we focus intensely on getting back on track. We define the performance gap, set clear recovery targets, and expect everyone to work urgently and accountably until performance standards are restored."},{orientation:"GOVERN",text:"When things go seriously wrong, we follow the established protocol. We activate risk management procedures, document accurately what occurred, and ensure that proper escalation and accountability channels are adhered to without exception."}]},{scenario_id:"D2-S1",dimension:"D2",title:"Primary Leadership Orientation",prompt_now:"How would you best describe the dominant approach that leaders take in this organisation?",prompt_preferred:"What dominant approach should leaders take in this organisation five years from now?",statements:[{orientation:"ENGAGE",text:"Leaders are primarily coaches and mentors. They prioritise development conversations, team cohesion, and creating environments where people feel genuinely seen, valued, and supported in their professional and personal growth."},{orientation:"INNOVATE",text:"Leaders are primarily visionaries and champions of change. They set ambitious directions, encourage unconventional thinking, and give people genuine autonomy to experiment and find solutions that have never been tried before."},{orientation:"PERFORM",text:"Leaders are primarily drivers and scorekeepers. They establish challenging targets, track performance rigorously, and hold people firmly to clear standards of measurable output, delivery, and commercial contribution."},{orientation:"GOVERN",text:"Leaders are primarily architects and stewards of process. They design efficient operating systems, maintain quality and consistency across operations, and preserve clear accountability structures throughout the organisation."}]},{scenario_id:"D2-S2",dimension:"D2",title:"How Leaders Invest Their Time",prompt_now:"How do leaders in this organisation characteristically spend their discretionary time and focused attention?",prompt_preferred:"How should leaders spend their discretionary time and focused attention in the future organisation?",statements:[{orientation:"ENGAGE",text:"Leaders invest significant time in coaching conversations, structured listening sessions, team cohesion activities, and ensuring that the human dimensions of work are not neglected or subordinated to performance pressure alone."},{orientation:"INNOVATE",text:"Leaders invest significant time scanning emerging trends, incubating new initiatives, removing barriers to experimentation, and personally sponsoring projects that challenge existing assumptions and inherited approaches."},{orientation:"PERFORM",text:"Leaders invest significant time reviewing performance data, calibrating against targets, eliminating execution bottlenecks, and actively pushing for consistently higher performance standards and outcomes across all functions."},{orientation:"GOVERN",text:"Leaders invest significant time in systems improvement, process design, compliance management, and ensuring that operational quality and established standards are consistently upheld and improved across all areas."}]},{scenario_id:"D2-S3",dimension:"D2",title:"What Leaders Are Recognised For",prompt_now:"What kinds of leadership contributions are most valued, celebrated, and emulated in this organisation?",prompt_preferred:"What kinds of leadership contributions should be most valued, celebrated, and emulated in the future?",statements:[{orientation:"ENGAGE",text:"Leaders are most celebrated for developing others, building deeply motivated and cohesive teams, handling difficult human situations with genuine wisdom and care, and creating authentic belonging within their areas of responsibility."},{orientation:"INNOVATE",text:"Leaders are most celebrated for inspiring new thinking, launching bold initiatives ahead of market demands, championing change before it is explicitly required, and consistently unlocking the creative potential of the people around them."},{orientation:"PERFORM",text:"Leaders are most celebrated for delivering outstanding results, consistently exceeding targets, building elite-performing teams, and generating measurable commercial or operational wins that materially advance the organisation's position."},{orientation:"GOVERN",text:"Leaders are most celebrated for building reliable and efficient systems, preventing costly problems before they arise, and maintaining consistent quality and compliance standards rigorously across their areas of responsibility."}]},{scenario_id:"D3-S1",dimension:"D3",title:"Core Management Philosophy",prompt_now:"How would you characterise the dominant philosophy used to manage and direct people in this organisation?",prompt_preferred:"What philosophy should dominate how people are managed and directed five years from now?",statements:[{orientation:"ENGAGE",text:"Employees are managed through relationship and meaningful participation. Managers prioritise collaborative decision-making, seek genuine team consensus, and ensure that all members have voice in matters that directly affect their daily work."},{orientation:"INNOVATE",text:"Employees are managed through autonomy and creative challenge. Managers provide generous space for independent thinking, tolerate productive failure as a natural element of learning, and actively reward intellectual initiative and experimentation."},{orientation:"PERFORM",text:"Employees are managed through clear targets and firm accountability. Managers set demanding performance expectations, track progress against measurable goals rigorously, and hold people to consistently high standards of delivery."},{orientation:"GOVERN",text:"Employees are managed through defined roles and established procedures. Managers ensure people understand their responsibilities clearly, adhere to documented protocols consistently, and perform within their designated remit reliably."}]},{scenario_id:"D3-S2",dimension:"D3",title:"Development and Growth Approach",prompt_now:"How does this organisation primarily develop, grow, and invest in the capabilities of its people?",prompt_preferred:"How should this organisation develop, grow, and invest in the capabilities of its people in the future?",statements:[{orientation:"ENGAGE",text:"Development is relationship-led. The most valued growth experiences are mentoring relationships, peer learning circles, team-based stretch projects, and the opportunity to develop alongside trusted, respected, and more experienced colleagues."},{orientation:"INNOVATE",text:"Development is discovery-led. The most valued experiences include stretch assignments beyond comfort zones, cross-functional exposure, experimentation with new approaches, and regular access to cutting-edge external thinking and innovation."},{orientation:"PERFORM",text:"Development is results-led. The most valued experiences are high-stakes projects with real accountability, performance coaching under meaningful pressure, visible delivery moments, and fast-track advancement for consistently strong performers."},{orientation:"GOVERN",text:"Development is competency-led. The most valued experiences are structured technical training programmes, professional certification, methodical skill-building against defined competency frameworks, and clear progression milestones with specified criteria."}]},{scenario_id:"D3-S3",dimension:"D3",title:"Performance Conversation Style",prompt_now:"How are performance conversations and feedback primarily conducted within this organisation?",prompt_preferred:"How should performance conversations and feedback be conducted in the future organisation?",statements:[{orientation:"ENGAGE",text:"Performance conversations are primarily supportive and developmental in tone. Feedback is delivered within a context of genuine care for the person, and performance challenges are met with coaching support and encouragement rather than pressure or sanction."},{orientation:"INNOVATE",text:"Performance conversations are primarily exploratory and future-oriented. The primary focus is on learning from experience, adapting approaches, and identifying the next bold challenge to pursue, rather than dwelling at length on past shortfalls."},{orientation:"PERFORM",text:"Performance conversations are primarily candid and accountability-driven. Honest feedback is delivered directly and without excessive softening, underperformance is named clearly, and improvement expectations are specific, measurable, and time-bound."},{orientation:"GOVERN",text:"Performance conversations are primarily structured and standards-based. Reviews follow a consistent and documented format, are benchmarked against defined competency frameworks, and result in recorded development plans with measurable milestones."}]},{scenario_id:"D4-S1",dimension:"D4",title:"Primary Bonding Mechanism",prompt_now:"What most fundamentally holds this organisation together and creates a coherent collective identity?",prompt_preferred:"What should most fundamentally hold this organisation together and create a coherent collective identity in the future?",statements:[{orientation:"ENGAGE",text:"What holds this organisation together is the quality of our relationships. Loyalty, mutual respect, and genuine care for each other create bonds that survive difficult periods, leadership transitions, and sustained external pressure."},{orientation:"INNOVATE",text:"What holds this organisation together is our shared hunger for what is possible. A collective excitement about the new, the untried, and the transformative creates enduring unity and common purpose across all functions and hierarchical levels."},{orientation:"PERFORM",text:"What holds this organisation together is our shared competitive drive. A collective commitment to winning, outperforming others, and delivering ambitious results creates a unifying force and common identity across all divisions."},{orientation:"GOVERN",text:"What holds this organisation together is adherence to shared systems and standards. Common processes, clearly defined policies, and consistent expectations create a unifying operational framework that guides and aligns collective behaviour."}]},{scenario_id:"D4-S2",dimension:"D4",title:"What Makes People Stay",prompt_now:"What is the primary reason that people decide to remain in this organisation over the long term?",prompt_preferred:"What should be the primary reason people decide to remain in this organisation over the long term?",statements:[{orientation:"ENGAGE",text:"People remain primarily because of the depth of relationships and genuine sense of belonging they experience here. The quality of their human connections (with colleagues, managers, and teams) is the decisive factor in their decision to stay."},{orientation:"INNOVATE",text:"People remain primarily because of the intellectual stimulation and growth the organisation continuously provides. The opportunity to work on genuinely novel problems, learn continuously, and pioneer meaningful solutions is the decisive retention factor."},{orientation:"PERFORM",text:"People remain primarily because of the high-performance culture and the compelling career trajectory it enables. The chance to achieve at a high level, advance rapidly, and be recognised for exceptional contribution keeps strong performers committed over time."},{orientation:"GOVERN",text:"People remain primarily because of the stability, security, and predictability the organisation dependably provides. Clear expectations, reliable processes, and predictable career progression create a sense of institutional safety that sustains long-term loyalty."}]},{scenario_id:"D4-S3",dimension:"D4",title:"Identity Through Change",prompt_now:"How does this organisation maintain a coherent sense of identity when going through significant change?",prompt_preferred:"How should this organisation maintain a coherent sense of identity through significant change in the future?",statements:[{orientation:"ENGAGE",text:"During significant change, the organisation anchors to its people-first values. Preserving trust, ensuring that no one is left behind, and maintaining relational continuity are the non-negotiable constants through any period of disruption or transformation."},{orientation:"INNOVATE",text:"During significant change, the organisation maintains identity through its appetite for reinvention. Change is not experienced as a threat but as a natural expression of who we are; agility and continuous adaptation are our defining cultural constants."},{orientation:"PERFORM",text:"During significant change, the organisation maintains identity through its performance orientation. The goal-driven culture and competitive spirit remain consistent and recognisable regardless of what is structurally changing around and beneath them."},{orientation:"GOVERN",text:"During significant change, the organisation maintains identity through structural discipline. Established processes provide institutional continuity, and well-documented protocols ensure operational consistency and predictability despite external disruption."}]},{scenario_id:"D5-S1",dimension:"D5",title:"Primary Strategic Orientation",prompt_now:"What is the most prominent orientation guiding how this organisation approaches strategy?",prompt_preferred:"What orientation should be most prominent in how this organisation approaches strategy five years from now?",statements:[{orientation:"ENGAGE",text:"Our strategy is oriented primarily toward human capital excellence. We believe that investing deeply in people (their skills, wellbeing, engagement, and development) is the most reliable and sustainable route to long-term organisational performance."},{orientation:"INNOVATE",text:"Our strategy is oriented primarily toward future opportunity and emerging capability. We invest ahead of where the market is moving, acquire leading capabilities early, and consistently prioritise positioning for what comes next over optimising what already exists."},{orientation:"PERFORM",text:"Our strategy is oriented primarily toward market leadership and sustained commercial excellence. We invest in capabilities that strengthen our competitive position, grow our revenue base, and deliver consistently superior returns to stakeholders."},{orientation:"GOVERN",text:"Our strategy is oriented primarily toward operational excellence and scalable efficiency. We invest in process improvement, quality management systems, enterprise risk reduction, and the infrastructure required to grow without compromising standards."}]},{scenario_id:"D5-S2",dimension:"D5",title:"Budget and Resource Allocation Logic",prompt_now:"When resources are allocated in this organisation, what consistently and reliably receives strategic priority?",prompt_preferred:"When resources are allocated in the future, what should consistently and reliably receive strategic priority?",statements:[{orientation:"ENGAGE",text:"People programmes receive consistent strategic priority. Learning and development budgets, employee experience investments, wellbeing programmes, and engagement initiatives are treated as core strategic expenditures, not discretionary or deferrable costs."},{orientation:"INNOVATE",text:"Innovation and growth programmes receive consistent strategic priority. Research and development, new capability investment, technology pilots, and market exploration are protected, including during periods of financial constraint and competitive pressure."},{orientation:"PERFORM",text:"Revenue-generating and commercial activities receive consistent strategic priority. Sales capability, marketing investment, customer acquisition, and performance management infrastructure are the primary beneficiaries of resource decisions."},{orientation:"GOVERN",text:"Systems infrastructure and compliance receive consistent strategic priority. Technology investment, process re-engineering, audit readiness, quality management, and institutional risk infrastructure are treated as non-negotiable operational foundations."}]},{scenario_id:"D5-S3",dimension:"D5",title:"Long-Term Investment Philosophy",prompt_now:"What investment logic most characteristically reflects how this organisation thinks about the next five years?",prompt_preferred:"What investment logic should characterise how this organisation thinks about the next five years?",statements:[{orientation:"ENGAGE",text:"Over a five-year horizon, we prioritise culture-building, employer brand strength, and talent pipeline development. We believe that an organisation with genuinely outstanding people practices will consistently outperform across any market or economic condition."},{orientation:"INNOVATE",text:"Over a five-year horizon, we prioritise positioning at the frontier of our industry. Early investments in emerging technology, unconventional business models, and frontier approaches are how we intend to create and sustain durable competitive leadership."},{orientation:"PERFORM",text:"Over a five-year horizon, we prioritise sustained commercial outperformance and market expansion. We set progressively demanding performance targets and build the execution capabilities required to consistently deliver against them at scale."},{orientation:"GOVERN",text:"Over a five-year horizon, we prioritise building reliable, scalable operating systems and institutional resilience. We invest in the infrastructure, standards, and process discipline required to deliver consistent excellence as the organisation scales."}]},{scenario_id:"D6-S1",dimension:"D6",title:"Organisational Success Definition",prompt_now:"How does this organisation primarily define and articulate what success means for it?",prompt_preferred:"How should this organisation define and articulate what success means for it in the future?",statements:[{orientation:"ENGAGE",text:"Success means that our people genuinely thrive. A highly engaged workforce, low voluntary turnover, outstanding employee experience scores, and leaders who invest consistently in developing others are the defining measures of our success as an organisation."},{orientation:"INNOVATE",text:"Success means that we lead our industry in originality and adaptive capability. Being consistently first with genuinely novel solutions, achieving recognition as pioneers and thought leaders, and building an innovation reputation that attracts exceptional talent define our success."},{orientation:"PERFORM",text:"Success means that we win commercially and outpace competition. Revenue growth, market share gains, consistent outperformance of competitors, and delivering superior returns to our stakeholders are the primary definitions of what success means here."},{orientation:"GOVERN",text:"Success means that we operate with systemic excellence. Consistent quality at scale, zero material compliance failures, efficient and reliable process execution, and dependable delivery within agreed cost and timeline parameters define success for us."}]},{scenario_id:"D6-S2",dimension:"D6",title:"What Gets Celebrated",prompt_now:"What types of achievements and behaviours are most enthusiastically recognised and celebrated here?",prompt_preferred:"What types of achievements and behaviours should be most enthusiastically recognised and celebrated in the future?",statements:[{orientation:"ENGAGE",text:"Genuine teamwork, remarkable acts of care, and outstanding cross-functional collaboration are celebrated most enthusiastically. Recognition focuses equally on collective achievement and individual contribution, and stories of human connection carry significant cultural status."},{orientation:"INNOVATE",text:"Breakthrough thinking, bold experiments, and the intellectual courage to attempt something genuinely new are celebrated most enthusiastically, regardless of whether every experiment ultimately succeeds or falls short of initial ambitions."},{orientation:"PERFORM",text:"Exceptional commercial results, ambitious targets exceeded, and elite individual and team performance are celebrated most enthusiastically. Numbers, competitive rankings, and tangible organisational wins carry enduring and significant cultural status."},{orientation:"GOVERN",text:"Flawless execution, consistently excellent quality, clean audit and compliance outcomes, and the sustained discipline to maintain high standards under operational pressure are what this organisation celebrates most enthusiastically and publicly."}]},{scenario_id:"D6-S3",dimension:"D6",title:"Performance Measurement Philosophy",prompt_now:"What types of metrics and measures most fundamentally reflect how this organisation tracks its performance?",prompt_preferred:"What types of metrics and measures should most fundamentally reflect how this organisation tracks performance five years from now?",statements:[{orientation:"ENGAGE",text:"We track success by the health and vitality of our people and their working relationships. Employee engagement scores, voluntary retention rates, team health indices, developmental feedback quality, and wellbeing indicators are the measures that carry the most weight here."},{orientation:"INNOVATE",text:"We track success by the vibrancy of our innovation pipeline and our rate of institutional learning. Speed of new initiative generation, successful pilot conversions, adoption velocity of new approaches, and experimentation frequency are the metrics we prioritise."},{orientation:"PERFORM",text:"We track success through rigorous commercial and operational KPIs. Revenue targets, margin ratios, market share data, customer acquisition metrics, and competitive positioning indicators are the primary performance measures we report upon and act on."},{orientation:"GOVERN",text:"We track success through quality, compliance, and operational efficiency metrics. Error rates, compliance scores, service-level adherence rates, process efficiency ratios, and audit outcomes are the foundational measures of our effectiveness as an organisation."}]}],likert:{D7:[{item_id:"D7-01",text:"Our organisation actively encourages adoption of new digital tools and technologies to improve how work is designed and executed."},{item_id:"D7-02",text:"When new technology is introduced, most employees approach it with genuine curiosity and openness rather than resistance and avoidance."},{item_id:"D7-03",text:"Senior leaders visibly model the use of digital tools and data-driven approaches in their own daily ways of working and communicating."},{item_id:"D7-04",text:"Important business decisions are regularly and meaningfully informed by data analytics and digital insights, not solely by experience, intuition, or hierarchy."},{item_id:"D7-05",text:"Meaningful and ongoing investment is made in digital skills development at all organisational levels, not only for technically designated staff."},{item_id:"D7-06",text:"Employees feel genuinely confident suggesting technology-based improvements to existing processes and workflows without fear of their ideas being dismissed."},{item_id:"D7-07",text:"This organisation has a clear, communicated, and actionable digital strategy that employees at all levels understand and can connect to their daily responsibilities."},{item_id:"D7-08",text:"Digital transformation initiatives are actively sponsored and visibly championed at the executive level, not simply delegated to and managed within the IT function."},{item_id:"D7-09",text:"Before full organisational deployment, new digital approaches are regularly piloted at a smaller scale, creating structured space for learning, iteration, and improvement."},{item_id:"D7-10",text:"Failure in a digital experiment is consistently treated as a valuable learning opportunity and a sign of healthy risk-taking rather than a cause for blame or punitive accountability."},{item_id:"D7-11",text:"Cross-functional collaboration on digital projects happens naturally, proactively, and with minimal bureaucratic friction in this organisation."},{item_id:"D7-12",text:"Our workforce collectively possesses the digital literacy required to perform effectively in current roles and to adapt with reasonable ease to tomorrow's evolving digital requirements."}],D8:[{item_id:"D8-01",text:"In this organisation, it is genuinely safe to take a reasonable professional or interpersonal risk, even when the outcome of that risk is genuinely uncertain."},{item_id:"D8-02",text:"People in this organisation can raise problems, surface concerns, and speak uncomfortable truths without realistic fear of negative consequences for their standing or career."},{item_id:"D8-03",text:"When mistakes occur in this organisation, they are approached as opportunities for collective learning and systemic improvement rather than as occasions for individual blame or shame."},{item_id:"D8-04",text:"Asking colleagues or managers for assistance (regardless of seniority or reporting-line relationships) is seen here as a sign of mature collaboration, not as personal weakness."},{item_id:"D8-05",text:"People here feel genuinely comfortable challenging decisions, plans, perspectives, or assumptions, including those expressed or endorsed by senior and executive leaders."},{item_id:"D8-06",text:"Diverse, dissenting, and unconventional viewpoints are actively sought out, carefully considered, and meaningfully incorporated when important organisational decisions are being made."},{item_id:"D8-07",text:"I can bring my authentic perspective and full identity to work in this organisation without needing to mask, suppress, or edit who I am or how I genuinely think."},{item_id:"D8-08",text:"Concerns about ethical issues, unfair treatment, unsafe practices, or value conflicts can be raised in this organisation without realistic fear of retaliation, marginalisation, or exclusion."},{item_id:"D8-09",text:"When a person sincerely disagrees with a decision that has been made, they are able to express that disagreement openly and directly without it damaging their professional standing or relationships."},{item_id:"D8-10",text:"This organisation's culture does not pressure people to perform certainty, project false confidence, or pretend they fully understand things they do not actually understand."},{item_id:"D8-11",text:"People in positions of authority in this organisation actively, visibly, and consistently invite challenge, productive dissent, and critical questioning rather than implicitly discouraging it."},{item_id:"D8-12",text:"Failures, setbacks, and near-miss incidents are discussed openly and constructively in this organisation so that collective learning occurs and avoidable mistakes are not repeated."}],D9:[{item_id:"D9-01",text:"Leadership communicates clearly, consistently, and with genuine transparency about the purpose, rationale, and expected impacts of significant organisational changes."},{item_id:"D9-02",text:"Employees feel genuinely heard, acknowledged, and meaningfully considered when they raise concerns, questions, or reservations about planned changes and strategic directions."},{item_id:"D9-03",text:"There is a compelling, specific, and widely understood organisational vision for where this organisation is heading and the reasoning behind that direction."},{item_id:"D9-04",text:"Adequate and well-planned resources (including time, budget, and appropriately skilled people) are allocated to support major change and transformation initiatives."},{item_id:"D9-05",text:"Middle managers in this organisation actively champion, personally embody, and consistently role-model the changes that senior leadership is formally requesting."},{item_id:"D9-06",text:"When this organisation has undertaken significant transformation or change efforts in the past, it has generally followed through with sufficient discipline, sustained commitment, and visible results."},{item_id:"D9-07",text:"Effective feedback mechanisms exist that allow employees at all levels to share their honest views on how change is actually unfolding, and to have confidence those views are genuinely considered."},{item_id:"D9-08",text:"This organisation actively recognises, rewards, and publicly celebrates behaviours and outcomes that demonstrably align with its stated strategic direction and desired cultural values."},{item_id:"D9-09",text:"This organisation is able to sustain meaningful change momentum over a 12 to 24 month period without significant energy loss, widespread confusion, or visible reversion to previous patterns."},{item_id:"D9-10",text:"Employees at all levels understand concretely and specifically what new behaviours, priorities, and ways of working are expected of them during significant transformation efforts."},{item_id:"D9-11",text:"This organisation systematically and deliberately learns from past change efforts (both successes and instructive failures) and actively applies those lessons to subsequent transformation initiatives."},{item_id:"D9-12",text:"The pace, sequencing, and communication of change in this organisation feels coherent and manageable rather than chaotic, exhausting, poorly planned, or inadequately supported."}]},eos:[{item_id:"EOS-Q1",text:"How likely would you be to recommend this organisation as a genuinely great place to work to a trusted friend or valued colleague?"},{item_id:"EOS-Q2",text:"How would you rate the overall quality and effectiveness of leadership at all levels in this organisation?"},{item_id:"EOS-Q3",text:"How would you rate this organisation's commitment to genuine innovation, creative risk-taking, and trying new approaches?"},{item_id:"EOS-Q4",text:"How satisfied are you with the quality and accessibility of professional development and career growth opportunities available to you?"},{item_id:"EOS-Q5",text:"How would you rate the transparency, openness, and quality of communication from organisational leadership?"},{item_id:"EOS-Q6",text:"How would you rate this organisation's tangible support for healthy work-life integration and genuine employee wellbeing?"},{item_id:"EOS-Q7",text:"How inclusive, fair, and equitable is this workplace in its treatment of people from all backgrounds, identities, and perspectives?"},{item_id:"EOS-Q8",text:"How effectively does this organisation's strategy and direction translate into clarity, meaning, and purpose in your day-to-day work?"}],qualitative:[{item_id:"QUAL-Q1",title:"Culture Strengths",text:"What are the greatest STRENGTHS of this organisation's culture? What specific aspects of how things are done here make you proud to be part of this organisation? Please give concrete examples wherever possible."},{item_id:"QUAL-Q2",title
